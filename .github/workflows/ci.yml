name: TechRoad CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    name: Backend Build & Automated Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Backend Dependencies
      run: dotnet restore Backend/Backend.sln

    - name: Build Backend Solution
      run: dotnet build Backend/Backend.sln --no-restore --configuration Release

    - name: Run Backend xUnit Tests
      run: dotnet test Backend/Backend.sln --no-build --configuration Release --verbosity normal

  frontend-build:
    name: Frontend Build & Lint Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: Frontend/techroad-client/package-lock.json

    - name: Install Frontend Dependencies
      working-directory: Frontend/techroad-client
      run: npm ci

    - name: Build Frontend (Vite)
      working-directory: Frontend/techroad-client
      run: npm run build
