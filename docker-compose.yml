services:
  backend:
    build:
      context: ./Backend/Backend
      dockerfile: Dockerfile
    container_name: techroad-backend
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__SecretKey=TechRoadSecureJsonWebTokenSecretKeyForDevelopmentAndEvaluation2026!
      - Jwt__Issuer=TechRoadAPI
      - Jwt__Audience=TechRoadClient
    volumes:
      - backend-data:/app/Data
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend/techroad-client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5000/api
    container_name: techroad-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
